name: 'Testing'
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bats:
    # Pinned: ubuntu-latest (26.04) has no legacy iptables support in its kernel,
    # but the docker-in-docker feature selects iptables-legacy inside the jammy
    # dev container, so the inner dockerd fails to create its NAT chain.
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetches all history of all tags and branches, necessary for running migration tests

      - name: Build and run Dev Container task
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            # The docker-in-docker feature starts dockerd in the background when
            # the container starts; wait for it before running the tests and show
            # its log if it never comes up.
            for i in $(seq 1 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
            if ! docker info > /dev/null 2>&1; then
              echo "::error::Docker daemon did not start within 60s"
              cat /tmp/dockerd.log || true
              exit 1
            fi
            echo "Docker daemon ready after ${i}s"
            bats tests/